<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & Post Request</title>
</head>
<body>
    <h3>Get Request Form</h3>
    <form action="http://localhost:8000/register" method="get">
        <input type="text" placeholder="enter a username" name="user">
        <input type="password" placeholder="enter a Password" name="password">
        <button type="submit">submit</button>
        <hr>
    <h3>Post Request Form</h3>
    <form action="http://localhost:8000/register" method="post">
        <input type="text" placeholder="enter a username" name="user">
        <input type="password" placeholder="enter a Password" name="password">
        <button type="submit">submit</button>
    </form>
    <script src="app.js"></script>
</body>
</html>
