<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | Movie Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2><i class="fa-solid fa-user-plus"></i> Create account</h2>
        <p>Join Movie Explorer and manage your watchlist.</p>
      </div>

      <form id="registerForm" class="auth-form">
        <label>Username</label>
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" required placeholder="Your name" />
        </div>

        <label>Email</label>
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <label>Password</label>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required placeholder="Minimum 6 characters" />
        </div>

        <button type="submit" class="btn-primary wide">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script>
    const BACKEND_URL = "http://localhost:3000";

    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !email || !password) {
        alert("Please fill all fields.");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();
        if (!data.success) {
          alert(data.message || "Registration failed.");
          return;
        }

        alert("Registration successful! Please login.");
        window.location.href = "login.html";
      } catch (err) {
        console.error(err);
        alert("Error registering. Check console.");
      }
    });
  </script>
</body>
</html>
